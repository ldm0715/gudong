name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_DIR: island_app/build/windows/x64/runner/Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' must look like v1.2.3 or v1.2.3-beta.1."
          }
          $version = $Matches[1]
          $buildVersion = ($version -split "-")[0]
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_VERSION=$buildVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Releasing version $version (build name $buildVersion)"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: island_service -> target

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          cache: true

      - name: Build sidecar
        working-directory: island_service
        run: cargo build --release --locked

      - name: Build app
        working-directory: island_app
        run: |
          flutter pub get
          flutter build windows --release --build-name $env:BUILD_VERSION --build-number ${{ github.run_number }}

      - name: Assemble release folder
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_DIR
          if (-not (Test-Path $release)) { throw "Missing build output: $release" }

          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "island_service/target/release/island_service.exe") $release -Force

          # Flutter links the MSVC runtime dynamically, so ship it app-local to
          # keep the portable zip working on clean machines. Find the files
          # through vswhere so the layout can differ between VS versions.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found." }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($vsPath) { $vsPath = $vsPath.Trim() }
          if (-not $vsPath) { throw "Visual Studio with the MSVC toolchain not found." }

          $names = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          $redist = Get-ChildItem (Join-Path $vsPath "VC\Redist") -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in $names -and $_.FullName -match '\\x64\\' }
          foreach ($name in $names) {
            $file = $redist | Where-Object Name -eq $name | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $file) { throw "Could not find $name in the Visual Studio redistributables." }
            Copy-Item $file.FullName $release -Force
            Write-Host "Bundled $name from $($file.FullName)"
          }

      - name: Package zip
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $stageRoot = Join-Path $dist "gudong-$env:VERSION-windows-x64"
          Remove-Item $stageRoot -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse (Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_DIR) $stageRoot
          Compress-Archive -Path $stageRoot -DestinationPath "$dist\gudong-$env:VERSION-windows-x64.zip" -CompressionLevel Optimal -Force

      - name: Build installer
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis --no-progress -y
          }
          if (-not (Test-Path $makensis)) { throw "makensis not found." }

          $release = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_DIR
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          & $makensis -INPUTCHARSET UTF8 "-DVERSION=$env:VERSION" "-DSOURCE_DIR=$release" "-DOUTDIR=$dist" "installer/gudong.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE." }

      - name: Compute checksums
        shell: pwsh
        run: |
          $files = @(
            (Join-Path $env:GITHUB_WORKSPACE "dist\gudong-$env:VERSION-windows-x64.zip"),
            (Join-Path $env:GITHUB_WORKSPACE "dist\gudong-$env:VERSION-setup.exe")
          )
          $rows = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing asset: $file" }
            $name = Split-Path -Leaf $file
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "| ``$name`` | ``$hash`` |"
          }
          $table = "| 文件 | SHA-256 |`n| --- | --- |`n" + ($rows -join "`n")
          Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "dist\checksums.md") -Value $table -Encoding utf8

      - name: Generate release notes
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\release-notes.ps1") `
            -Version $env:VERSION `
            -Changelog (Join-Path $env:GITHUB_WORKSPACE "changeslog.md") `
            -ChecksumsFile (Join-Path $env:GITHUB_WORKSPACE "dist\checksums.md") `
            -Output (Join-Path $env:GITHUB_WORKSPACE "dist\release-notes.md")

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: gudong v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/gudong-${{ env.VERSION }}-windows-x64.zip
            dist/gudong-${{ env.VERSION }}-setup.exe
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.VERSION, '-') }}
